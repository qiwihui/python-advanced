{% extends "!layout.html" %}

{% block extrahead %}
{{ super() }}
<!-- Warm up connections used by AdSense so the first ad renders sooner. -->
<link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin>
<link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin>
<link rel="preconnect" href="https://tpc.googlesyndication.com" crossorigin>
<!-- AdSense Auto ads: placement and formats are managed in AdSense. -->
<script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8935595858652656"
        crossorigin="anonymous"></script>
<style>
/* Keep auto-placed units clear of floated content and give them room. */
.rst-content .google-auto-placed { clear: both; margin: 24px 0; }
/* Collapse slots AdSense could not fill instead of leaving a gap. */
ins.adsbygoogle[data-ad-status="unfilled"] { display: none !important; }
@media print { ins.adsbygoogle, .google-auto-placed { display: none !important; } }
</style>
{% endblock %}

{% block footer %}
{{ super() }}
<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KHWGNSMXWL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-KHWGNSMXWL');
</script>

{% endblock %}
